plugins {
	id 'java'
}

repositories {
	mavenLocal()
	maven {
		url = 'https://repo.runelite.net'
		content {
			includeGroupByRegex("net\\.runelite.*")
		}
	}
	mavenCentral()
}

def runeLiteVersion = 'latest.release'
def pluginMainClass = 'com.osrsbingo.BingoPluginLauncher'

dependencies {
	compileOnly group: 'net.runelite', name: 'client', version: runeLiteVersion

	compileOnly 'org.projectlombok:lombok:1.18.30'
	annotationProcessor 'org.projectlombok:lombok:1.18.30'

	testImplementation group: 'net.runelite', name: 'client', version: runeLiteVersion
	testImplementation group: 'net.runelite', name: 'jshell', version: runeLiteVersion
	testImplementation 'junit:junit:4.13.2'
	// No slf4j-simple: RuneLite pulls logback-classic transitively, and
	// RuneLite.main casts the root logger to ch.qos.logback.classic.Logger.
	// A second binding (slf4j-simple) makes SLF4J pick the wrong one and the
	// dev client (`./gradlew run`) dies with a ClassCastException on startup.
	testImplementation 'org.mockito:mockito-core:3.12.4'
	testImplementation 'com.squareup.okhttp3:mockwebserver:3.14.9'

	testCompileOnly 'org.projectlombok:lombok:1.18.30'
	testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

group = 'com.osrsbingo'
version = '1.0.0'

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.release.set(11)
}

test {
	useJUnit()
	testLogging {
		events 'passed', 'skipped', 'failed'
	}
}

// Launches the real RuneLite client with this plugin loaded.
tasks.register('run', JavaExec) {
	classpath = sourceSets.test.runtimeClasspath
	mainClass = pluginMainClass

	jvmArgs "-ea"
	args "--developer-mode", "--debug"
}
